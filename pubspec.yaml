name: stop_snoozer
description: "StopSnoozer – Never Miss Your Stop Again."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  go_router: ^14.2.7
  sqflite: ^2.3.3+2
  path: ^1.9.0
  path_provider: ^2.1.4
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/uk.db.gz
    # Bundled Inter + Sora so google_fonts NEVER reaches fonts.gstatic.com.
    # This app is offline-first and is used underground; downloading a font on
    # first launch is exactly the wrong dependency. Runtime fetching is also
    # disabled in main.dart - both halves are needed.
    # Generated as static instances from the upstream variable fonts (Google
    # publishes no static weights any more). OFL licences ship alongside, as
    # the SIL Open Font License requires.
    - assets/google_fonts/
